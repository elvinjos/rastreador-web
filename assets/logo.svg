<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="160" height="160">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="10" y="10" width="180" height="180" rx="42" fill="url(#bgGrad)" stroke="#334155" stroke-width="2.5"/>

  <!-- Radar / Web Grid Circles -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.6"/>
  <circle cx="100" cy="100" r="50" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
  <circle cx="100" cy="100" r="30" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.7"/>

  <!-- Crosshairs / Radar Axis -->
  <line x1="100" y1="26" x2="100" y2="174" stroke="#475569" stroke-width="1" opacity="0.4"/>
  <line x1="26" y1="100" x2="174" y2="100" stroke="#475569" stroke-width="1" opacity="0.4"/>

  <!-- Globe / Network Nodes -->
  <ellipse cx="100" cy="100" rx="42" ry="70" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.8" />
  
  <!-- Radar Sweep Cone -->
  <path d="M 100 100 L 150 50 A 70 70 0 0 0 100 30 Z" fill="url(#glowGrad)" opacity="0.18" />

  <!-- Central Target Node -->
  <circle cx="100" cy="100" r="9" fill="url(#accentGrad)" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="4" fill="#ffffff"/>

  <!-- Ping / Satellite Nodes -->
  <circle cx="145" cy="65" r="4.5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="62" cy="132" r="3.5" fill="#10b981" filter="url(#glow)"/>
  <circle cx="130" cy="138" r="3" fill="#818cf8"/>
  <circle cx="70" cy="68" r="3" fill="#38bdf8"/>
</svg>
